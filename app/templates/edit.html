{% extends "base.html" %}
{% block content %}

<h2>{% if ticket %}Edit ticket{% else %}New ticket{% endif %}</h2>

<form method="post" action="/tickets" class="ticket-form">
    {% if ticket %}<input type="hidden" name="id" value="{{ ticket.id }}">{% endif %}

    <h3 class="section-title first">Event</h3>

    <label>Artist *
        <input type="text" name="artist" required value="{{ ticket.artist if ticket else '' }}">
    </label>

    <label>Location
        <input type="text" name="location" value="{{ ticket.location if ticket and ticket.location else '' }}">
    </label>

    <label>Notes (section, ticket type, etc.)
        <input type="text" name="notes" value="{{ ticket.notes if ticket and ticket.notes else '' }}">
    </label>

    <label>Seat number
        <input type="text" name="seat_number" value="{{ ticket.seat_number if ticket and ticket.seat_number else '' }}">
    </label>

    <label>Event date
        <input type="date" name="event_date" value="{{ ticket.event_date if ticket and ticket.event_date else '' }}">
    </label>

    <label>Status
        <select name="status">
            {% set current = ticket.status if ticket else 'bought' %}
            {% for s in ['bought', 'listed', 'sold', 'used', 'refunded'] %}
                <option value="{{ s }}" {% if s == current %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </label>

    <h3 class="section-title">Purchase</h3>

    <label>Bought from (platform)
        <input type="text" name="purchase_platform" placeholder="e.g. axs, ticketmaster, see tickets"
               value="{{ ticket.purchase_platform if ticket and ticket.purchase_platform else '' }}">
    </label>

    <label>Ticket format
        <input type="text" name="ticket_type" placeholder="e.g. mobile, pdf, paper, e-ticket"
               value="{{ ticket.ticket_type if ticket and ticket.ticket_type else '' }}">
    </label>

    <fieldset>
        <legend>Bought for</legend>
        <input type="number" step="0.01" name="price_bought_amount" placeholder="Amount"
               value="{{ ticket.price_bought_amount if ticket and ticket.price_bought_amount is not none else '' }}">
        <select name="price_bought_currency">
            {% set cb = ticket.price_bought_currency if ticket else 'GBP' %}
            <option value="GBP" {% if cb == 'GBP' %}selected{% endif %}>GBP</option>
            <option value="USD" {% if cb == 'USD' %}selected{% endif %}>USD</option>
        </select>
    </fieldset>

    <h3 class="section-title">Sale &amp; Delivery</h3>
    <p class="section-hint">Auto-populated from sale emails. Edit anything that's wrong or missing.</p>

    <fieldset>
        <legend>Sold for</legend>
        <input type="number" step="0.01" name="price_sold_amount" placeholder="Amount"
               value="{{ ticket.price_sold_amount if ticket and ticket.price_sold_amount is not none else '' }}">
        <select name="price_sold_currency">
            {% set cs = ticket.price_sold_currency if ticket else 'GBP' %}
            <option value="GBP" {% if cs == 'GBP' %}selected{% endif %}>GBP</option>
            <option value="USD" {% if cs == 'USD' %}selected{% endif %}>USD</option>
        </select>
    </fieldset>

    <label>Buyer name
        <input type="text" name="buyer_name" value="{{ ticket.buyer_name if ticket and ticket.buyer_name else '' }}">
    </label>

    <label>Buyer email
        <input type="email" name="buyer_email" value="{{ ticket.buyer_email if ticket and ticket.buyer_email else '' }}">
    </label>

    <label>Buyer phone
        <input type="tel" name="buyer_phone" placeholder="+44 7..."
               value="{{ ticket.buyer_phone if ticket and ticket.buyer_phone else '' }}">
    </label>

    <label>Delivery method
        <input type="text" name="delivery_method" placeholder="e.g. Mobile transfer, Email PDF, Courier"
               value="{{ ticket.delivery_method if ticket and ticket.delivery_method else '' }}">
    </label>

    <label>Deliver by
        <input type="date" name="delivery_deadline" value="{{ ticket.delivery_deadline if ticket and ticket.delivery_deadline else '' }}">
    </label>

    <label>Sold on (platform)
        <input type="text" name="sale_platform" placeholder="e.g. viagogo, stubhub, twickets"
               value="{{ ticket.sale_platform if ticket and ticket.sale_platform else '' }}">
    </label>

    <label>Order reference
        <input type="text" name="order_reference" value="{{ ticket.order_reference if ticket and ticket.order_reference else '' }}">
    </label>

    <label>Delivery notes
        <input type="text" name="delivery_notes" value="{{ ticket.delivery_notes if ticket and ticket.delivery_notes else '' }}">
    </label>

    <label class="checkbox-label">
        <input type="checkbox" name="delivered" value="1" {% if ticket and ticket.delivered %}checked{% endif %}>
        Delivered to buyer
    </label>

    <div class="form-actions">
        <button type="submit" class="btn primary">Save</button>
        <a href="/" class="btn">Cancel</a>
    </div>
</form>

{% endblock %}
