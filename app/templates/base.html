<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ticket Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1><a href="/">🎟️ Ticket Tracker</a></h1>
        <nav>
            {% if user %}
                {% if user.role == 'admin' %}
                    <a href="/tickets/new" class="btn primary">+ Add ticket</a>
                    <a href="/tickets/paste" class="btn">📋 Paste email</a>
                    <form method="post" action="/poll" class="inline">
                        <button class="btn">Poll inbox now</button>
                    </form>
                    <form method="post" action="/poll?force=1" class="inline"
                          onsubmit="return confirm('Force-reparse all unread emails, even ones previously seen?\\n\\nUseful when an email was misidentified or a sale arrived before the purchase email.')">
                        <button class="btn ghost" title="Re-parse unread emails even if already processed">↻ Force reprocess</button>
                    </form>
                {% endif %}
                <span class="user">{{ user.username }} <span class="badge">{{ user.role }}</span></span>
                <form method="post" action="/logout" class="inline">
                    <button class="btn ghost">Log out</button>
                </form>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
