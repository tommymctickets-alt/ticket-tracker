services:
  - type: web
    name: ticket-tracker
    runtime: python
    region: frankfurt   # closest Render region to the UK; change if you like
    plan: starter        # always-on; needed so email polling keeps working
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render makes a random one for you
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: POLL_INTERVAL_MINUTES
        value: "5"
